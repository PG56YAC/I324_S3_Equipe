name: Bot

# Répond aux élèves dans leur issue, à chaque étape du travail en équipe.
on:
  issues:
    types: [assigned, opened]
  push:
    branches-ignore: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  # Rattrapage : GitHub ne déclenche rien sur les revues d'une PR en conflit
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  # Attribution des relecteurs : une seule à la fois sur tout le dépôt.
  # Une exécution en attente peut être annulée par une plus récente : sans risque, chacune relit tout l'état.
  relecteurs:
    name: Attribuer les relecteurs
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    concurrency:
      group: relecteurs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/bot
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Attribuer
        env:
          MODE: relecteurs
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROPRIO: ${{ github.repository_owner }}
          EVENEMENT: ${{ github.event_name }}
          ACTEUR: ${{ github.actor }}
        run: node .github/bot/bot.js

  # Réponses : pas de file commune, pour qu'aucune réponse ne soit annulée
  bot:
    name: Bot travail en équipe
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/bot
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Répondre
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROPRIO: ${{ github.repository_owner }}
          EVENEMENT: ${{ github.event_name }}
          ACTEUR: ${{ github.event.workflow_run.actor.login || github.actor }}
        run: node .github/bot/bot.js
